<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e2b">
  <title>QUIZ ARENA – Challenge Your Friends</title>
  <meta name="description" content="Real-time multiplayer quiz game. Create a private room, share the link, and battle your friends.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%238b5cf6' stroke-width='8'/%3E%3Cpath d='M32 6a26 26 0 0 1 22 12' fill='none' stroke='%2322d3ee' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8b5cf6"/><stop offset="0.5" stop-color="#4f8bff"/><stop offset="1" stop-color="#22d3ee"/>
      </linearGradient>
    </defs>
  </svg>
  <main id="app"><noscript>QUIZ ARENA needs JavaScript to run.</noscript></main>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="net" class="net" hidden>Connection lost. Reconnecting…</div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="/app.js" defer></script>
</body>
</html>
